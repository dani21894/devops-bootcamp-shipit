name: cicd
on:
  pull_request:
    types: [opened, synchronize, reopened, closed]
defaults:
  run:
    working-directory: launchpad

jobs:
  test:
    if: github.event.pull_request.merged == false   # tambah  
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
      - run: npm clean-install
      - run: npm run test                       # step terakhir job
      - run: bash scripts/report.sh
        env:
          BOARD_URL: http://54.179.146.138
          SHIPIT_TOKEN: AVDOXOP7NFVWA7G76LLZOV3KNKV22     
  deploy:  
    needs: test
    if: always() && github.event.pull_request.merged == true   # tambah
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
      - run: npm clean-install      
      - run: npm run build
        env:
          VITE_BOARD_URL: http://54.179.146.138
      - uses: actions/upload-pages-artifact@v5
        with:
          path: launchpad/dist
      - uses: actions/deploy-pages@v5
# tambah di bawah sekali
permissions:
  pages: write
  id-token: write
